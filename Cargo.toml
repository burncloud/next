[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/identity",
    "crates/billing",
    "crates/supply",
    "crates/router",
    "crates/runtime",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
publish = false
description = "BurnCloud 整体框架：各领域积木的接口总图（参数进、结果出），只放签名。"

[workspace.lints.rust]
unsafe_code = "forbid"
